name: Build and Test raylib-wasi

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM, Clang and WASI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld wasi-libc zip

      - name: Build raylib-wasi library and bundle
        run: make all

      - name: Build example programs
        run: make examples

      - name: Run test suites
        run: make test

      - name: Package release archives
        run: make package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raylib-wasi-dist
          path: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
            dist/include/
            dist/lib/

      - name: Publish Latest Pre-release (Push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "raylib-wasi latest (rolling build)"
          body: |
            Automated continuous build from the latest commit on `main`.

            ### 📦 Downloadable Assets:
            - **`raylib-wasi.tar.gz`**: Precompiled distribution archive (`include/`, `lib/libraylib.a`, and `raylib-host.js`)
            - **`raylib-wasi.zip`**: ZIP archive of the distribution bundle
            - **`raylib-host.js`**: Standalone vanilla ES module host runtime bridge
            - **`raylib-host.d.ts`**: TypeScript definitions
          prerelease: true
          files: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Release (Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "raylib-wasi ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
