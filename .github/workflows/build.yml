name: Build and Test raylib-wasi

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          npm install

      - name: Set up wasi-sdk toolchain
        run: |
          make toolchain
          echo "$GITHUB_WORKSPACE/.wasi-sdk/bin" >> $GITHUB_PATH

      - name: Build raylib-wasi library and bundle
        run: make all

      - name: Build example programs
        run: make examples

      - name: Run test suites
        run: make test

      - name: Package release archives
        run: make package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raylib-wasi-dist
          path: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
            dist/include/
            dist/lib/
            dist/*.tgz

      - name: Publish Versioned Release (v* Tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "raylib-wasi ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rolling Update 'latest' Git Tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push --force origin refs/tags/latest

      - name: Remove Stale Rolling 'latest' Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true

      - name: Publish Rolling 'latest' Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest (${{ github.ref_name }})"
          body: |
            Rolling release pointing to `${{ github.ref_name }}` (`${{ github.sha }}`).

            ### 📦 Downloadable Assets:
            - **`raylib-wasi-*.tgz`**: Ready-to-use npm package tarball for fast zero-submodule `npm install`
            - **`raylib-wasi.tar.gz`**: Precompiled distribution archive (`include/`, `lib/libraylib.a`, and `raylib-host.js`)
            - **`raylib-wasi.zip`**: ZIP archive of the distribution bundle
            - **`raylib-host.js`**: Standalone vanilla ES module host runtime bridge
            - **`raylib-host.d.ts`**: TypeScript definitions
          make_latest: "false"
          files: |
            dist/raylib-wasi.tar.gz
            dist/raylib-wasi.zip
            dist/raylib-host.js
            dist/raylib-host.d.ts
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
